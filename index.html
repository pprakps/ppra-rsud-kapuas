<!DOCTYPE html>
<html>
<head>
  <title>Formulir & Status Praotorisasi PPRA</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
    .container { background-color: white; padding: 20px; border-radius: 8px; max-width: 700px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, select, textarea { margin-bottom: 15px; padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 12px 20px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background-color: #004494; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    .form-group { margin-bottom: 10px; }
    
    /* Gaya untuk Tabel Status */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #0056b3; color: white; }
    .btn-refresh { background-color: #28a745; margin-top: 20px; }
    .btn-refresh:hover { background-color: #218838; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align: center; color: #333;">Permintaan Antibiotik Reserve</h2>
    
    <form id="ppraForm">
      <div class="form-group"><label>Nama Pasien:</label><input type="text" id="Nama_Pasien" required></div>
      <div class="form-group"><label>No. RM:</label><input type="text" id="No_RM" required></div>
      <div class="form-group"><label>Nama DPJP:</label><input type="text" id="Nama_DPJP" required></div>
      <div class="form-group"><label>Diagnosa:</label><input type="text" id="Diagnosa" required></div>
      <div class="form-group">
        <label>Pilih Antibiotik Reserve:</label>
        <select id="Antibiotik">
          <option value="Meropenem (IV)">Meropenem (IV)</option>
          <option value="Seftazidim (IV)">Seftazidim (IV)</option>
          <option value="Vankomisin (IV)">Vankomisin (IV)</option>
        </select>
      </div>
      <div class="form-group"><label>Regimen Dosis:</label><input type="text" id="Regimen_Dosis" required></div>
      <div class="form-group">
        <label>Indikasi:</label>
        <select id="Indikasi">
          <option value="Empiris">Empiris</option>
          <option value="Definitif">Definitif</option>
          <option value="Profilaksis">Profilaksis</option>
        </select>
      </div>
      <div class="form-group">
        <label>Upload Foto Hasil Kultur (Kosongkan jika tidak ada):</label>
        <input type="file" id="Foto_Kultur" accept="image/*">
      </div>
      <div class="form-group"><label>Alasan Permintaan:</label><textarea id="Alasan" rows="3" required></textarea></div>

      <button type="submit" id="btnSubmit">Kirim Permintaan ke Tim PGA</button>
    </form>

    <hr style="margin: 40px 0;">

    <h2 style="text-align: center; color: #333;">Status Antrean Permintaan</h2>
    <button class="btn-refresh" onclick="muatStatus()">🔄 Muat Ulang Data Terbaru</button>
    
    <table>
      <thead>
        <tr>
          <th>Nama Pasien</th>
          <th>No. RM</th>
          <th>Antibiotik</th>
          <th>Status</th>
          <th>Catatan PGA</th>
        </tr>
      </thead>
      <tbody id="tabelStatus">
        <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // GANTI URL DI BAWAH DENGAN WEB APP URL ANDA YANG PALING BARU (LANGKAH 2)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlpCTqXGvHcxbVTfIf4OaWW5nTv1RTu8FsthBMdIiooVyotQv723eQYQWILEKZTxL_CQ/exec";

    // --- KODE UNTUK MENGIRIM DATA (SAMA SEPERTI SEBELUMNYA) ---
    document.getElementById("ppraForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.innerText = "Mengirim Data... Mohon Tunggu";
      btn.disabled = true;

      const fileInput = document.getElementById("Foto_Kultur");
      const payload = {
        Nama_Pasien: document.getElementById("Nama_Pasien").value,
        No_RM: document.getElementById("No_RM").value,
        Nama_DPJP: document.getElementById("Nama_DPJP").value,
        Diagnosa: document.getElementById("Diagnosa").value,
        Antibiotik: document.getElementById("Antibiotik").value,
        Regimen_Dosis: document.getElementById("Regimen_Dosis").value,
        Indikasi: document.getElementById("Indikasi").value,
        Alasan: document.getElementById("Alasan").value,
        fileBase64: null,
        fileName: null
      };

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
          payload.fileBase64 = event.target.result;
          payload.fileName = file.name;
          kirimKeServer(payload);
        };
        reader.readAsDataURL(file);
      } else {
        kirimKeServer(payload);
      }
    });

    function kirimKeServer(payload) {
      fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(response => response.text())
      .then(data => {
        alert("Data berhasil dikirim!");
        document.getElementById("ppraForm").reset();
        const btn = document.getElementById("btnSubmit");
        btn.innerText = "Kirim Permintaan ke Tim PGA";
        btn.disabled = false;
        muatStatus(); // Otomatis memuat ulang tabel setelah kirim
      })
      .catch(error => {
        alert("Terjadi kesalahan. Coba lagi.");
        const btn = document.getElementById("btnSubmit");
        btn.innerText = "Kirim Permintaan ke Tim PGA";
        btn.disabled = false;
      });
    }

    // --- KODE BARU: UNTUK MEMBACA DAN MENAMPILKAN STATUS DARI SHEETS ---
    function muatStatus() {
      const tbody = document.getElementById("tabelStatus");
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data dari server...</td></tr>';

      fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
          tbody.innerHTML = "";
          if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data permintaan.</td></tr>';
            return;
          }
          
          // Membaca data dari yang paling baru (bawah ke atas)
          for (let i = data.length - 1; i >= 0; i--) {
            const row = data[i];
            
            // Memberi warna otomatis pada tulisan status
            let warnaStatus = "#333";
            let fontTebal = "bold";
            if (row.Status === "DISETUJUI") warnaStatus = "green";
            if (row.Status === "DITOLAK") warnaStatus = "red";
            if (row.Status === "DITUNDA") warnaStatus = "orange";
            if (row.Status === "DISETUJUI DENGAN CATATAN") warnaStatus = "#0056b3";

            tbody.innerHTML += `
              <tr>
                <td>${row.Nama_Pasien}</td>
                <td>${row.No_RM}</td>
                <td>${row.Antibiotik}</td>
                <td style="color: ${warnaStatus}; font-weight: ${fontTebal};">${row.Status}</td>
                <td>${row.Catatan}</td>
              </tr>
            `;
          }
        })
        .catch(error => {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat data antrean. Pastikan URL Web App sudah benar.</td></tr>';
        });
    }

    // Jalankan fungsi muat tabel otomatis saat website pertama kali dibuka
    window.onload = muatStatus;
  </script>
</body>
</html>
