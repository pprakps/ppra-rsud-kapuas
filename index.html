<!DOCTYPE html>
<html>
<head>
  <title>Formulir Praotorisasi PPRA</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
    .container { background-color: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, select { margin-bottom: 15px; padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background-color: #004494; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align: center; color: #333;">Permintaan Antibiotik Reserve</h2>
    
    <!-- GANTI URL_ANDA_DISINI DENGAN WEB APP URL DARI GOOGLE SCRIPT -->
    <form method="POST" action="https://script.google.com/macros/s/AKfycbxgpzn8-Y0d2weUxL8hlJr-6nwPzyGBwwcKyKhKHvtf7ssDQADoumbzMeygDeBa14FGmw/exec
">
      
      <label>Nama Pasien:</label>
      <input type="text" name="Nama_Pasien" required>

      <label>No. RM:</label>
      <input type="text" name="No_RM" required>

      <label>Nama DPJP:</label>
      <input type="text" name="Nama_DPJP" required>

      <label>Pilih Antibiotik Reserve:</label>
      <select name="Antibiotik">
        <option value="Meropenem (IV)">Meropenem (IV)</option>
        <option value="Seftazidim (IV)">Seftazidim (IV)</option>
      </select>

      <label>Indikasi:</label>
      <select name="Indikasi">
        <option value="Empiris">Empiris</option>
        <option value="Definitif">Definitif</option>
        <option value="Profilaksis">Profilaksis</option>
      </select>

      <button type="submit">Kirim Permintaan ke Tim PGA</button>
    </form>
  </div>
</body>
</html>
